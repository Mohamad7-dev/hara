name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hara_app/lib/**'
      - 'hara_app/pubspec.yaml'
      - 'hara_app/pubspec.lock'
      - 'hara_app/android/**'
      - '.github/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/hara-release.jks
            echo "store_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_B64 secret set — building with debug signing."
            echo "store_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build split APKs
        working-directory: hara_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.store_ok == 'true' && format('{0}/keystore/hara-release.jks', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE=https://hara-api.onrender.com --dart-define=GOOGLE_CLIENT_ID=272031745698-9bnqslh5j67c27m92q9n88j4pp1f7m44.apps.googleusercontent.com

      - name: Build universal APK
        working-directory: hara_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.store_ok == 'true' && format('{0}/keystore/hara-release.jks', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=API_BASE=https://hara-api.onrender.com --dart-define=GOOGLE_CLIENT_ID=272031745698-9bnqslh5j67c27m92q9n88j4pp1f7m44.apps.googleusercontent.com

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hara-app-release
          path: hara_app/build/app/outputs/flutter-apk/*-release.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: hara_app
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk app-release-arm64.apk
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
          gh release create apk-latest \
            app-release-arm64.apk \
            app-release.apk \
            --title "تطبيق حارة (أحدث نسخة)" \
            --notes "آخر نسخة من تطبيق حارة" \
            --latest \
            || (gh release upload apk-latest app-release-arm64.apk --clobber && gh release upload apk-latest app-release.apk --clobber)
