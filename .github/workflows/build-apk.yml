name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hara_app/lib/**'
      - 'hara_app/pubspec.yaml'
      - 'hara_app/pubspec.lock'
      - 'hara_app/android/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Build APK
        working-directory: hara_app
        run: flutter build apk --release --dart-define=API_BASE=https://hara-api.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hara-app-release
          path: hara_app/build/app/outputs/flutter-apk/app-release.apk
