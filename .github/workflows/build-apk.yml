name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hara_app/lib/**'
      - 'hara_app/pubspec.yaml'
      - 'hara_app/pubspec.lock'
      - 'hara_app/android/**'
      - '.github/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Build APK
        working-directory: hara_app
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE=https://hara-api.onrender.com

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hara-app-release
          path: hara_app/build/app/outputs/flutter-apk/*-release.apk

      - name: Publish arm64 to Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: hara_app
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk app-release-arm64.apk
          gh release create apk-latest \
            app-release-arm64.apk \
            --title "تطبيق حارة (أحدث نسخة)" \
            --notes "آخر نسخة من تطبيق حارة" \
            --latest \
            || gh release upload apk-latest app-release-arm64.apk --clobber
