<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="حارة - منصة توصيل وشراء محلي">
  <meta name="theme-color" content="#3B2A1D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="حارة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>حارة</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #hara-loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #FBF8F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }
    #hara-loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 32%, #4a3421 0%, #3B2A1D 55%, #241710 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }
    #hara-loader .app-icon {
      width: 112px; height: 112px;
      border-radius: 26px;
      border: 2px solid rgba(255,255,255,.18);
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
      margin-bottom: 26px;
    }
    #hara-loader .nav-logo {
      height: 52px;
      margin-bottom: 22px;
    }
    #hara-loader p {
      color: #D9C9A3;
      font-size: 13px;
      letter-spacing: .3px;
    }
  </style>
</head>
<body>
  <div id="hara-loader">
    <img class="app-icon" src="icons/Icon-192.png" alt="">
    <img class="nav-logo" src="splash_logo_white.png" alt="حارة">
    <p>جارٍ التحميل...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('hara-loader');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
