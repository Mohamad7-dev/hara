services:
  - type: web
    name: hara-api
    runtime: python
    rootDir: hara_app/server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/products
    envVars:
      - key: GATEWAY
        value: simulation
      - key: PYTHON_VERSION
        value: 3.11.0
